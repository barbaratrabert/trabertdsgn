<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página en mantención</title>

    <!-- Tipografía opcional (puedes quitarla si no la quieres) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #111;
        }

        .maintenance {
            text-align: center;
            padding: 40px;
        }

        .maintenance img {
            width: 160px;      /* ajusta el tamaño del logo */
            max-width: 100%;
            margin-bottom: 24px;
        }

        .maintenance h1 {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .maintenance p {
            font-size: 0.95rem;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="maintenance">
        <!-- LOGO SVG -->
        <img src="https://trabertdsgn.cl/img2/logo.svg" alt="Logo">

        <h1>Página en mantención</h1>
        <p>Estamos trabajando para volver pronto.</p>
    </div>

</body>
</html>
